<style>body{margin:0;background:#fff;font:14px/1.3 -apple-system,Helvetica,Arial,sans-serif;color:#111}

<div class="row"><img class="big" style="height:200px" src="concept-f-bowl-v1.svg"><div><h2>F · Scoop in a bowl</h2><p>One scoop resting in a bowl: caught and kept.</p><div class="dark"><img height="48" src="concept-f-bowl-v1.svg"></div></div><div class="sm"><img height="64" src="concept-f-bowl-v1.svg"><img height="32" src="concept-f-bowl-v1.svg"><img height="16" src="concept-f-bowl-v1.svg"></div></div>
