<!doctype html><meta charset="utf-8"><title>Scoop styled concepts</title>
<style>body{margin:0;background:#fff;font:14px/1.3 -apple-system,Helvetica,Arial,sans-serif;color:#111}
.row{display:grid;grid-template-columns:240px 1fr 150px 200px;align-items:center;gap:32px;padding:28px 40px;border-bottom:1px solid #ddd}
.big{height:200px}.sm{display:flex;align-items:flex-end;gap:18px}.tile{background:#FBCFE8;border-radius:28px;width:150px;height:150px;display:grid;place-items:center}
h2{margin:0 0 6px;font-size:18px}p{margin:0;color:#555}</style>
<div class="row"><img class="big" src="styled-s1-cone-v1.svg"><div><h2>S1 · Cone</h2><p>The plain ice cream in the outlined style.</p></div><div class="tile"><img height="110" src="styled-s1-cone-v1.svg"></div><div class="sm"><img height="64" src="styled-s1-cone-v1.svg"><img height="32" src="styled-s1-cone-v1.svg"><img height="16" src="styled-s1-cone-v1.svg"></div></div>
<div class="row"><img class="big" src="styled-s2-cursor-v1.svg"><div><h2>S2 · Cursor cone</h2><p>The same ice cream tilted so the cone is the pointer.</p></div><div class="tile"><img height="110" src="styled-s2-cursor-v1.svg"></div><div class="sm"><img height="64" src="styled-s2-cursor-v1.svg"><img height="32" src="styled-s2-cursor-v1.svg"><img height="16" src="styled-s2-cursor-v1.svg"></div></div>
<div class="row"><img class="big" src="styled-s3-tray-v1.svg"><div><h2>S3 · Cone into tray</h2><p>The ice cream as the arrow of a save icon.</p></div><div class="tile"><img height="110" src="styled-s3-tray-v1.svg"></div><div class="sm"><img height="64" src="styled-s3-tray-v1.svg"><img height="32" src="styled-s3-tray-v1.svg"><img height="16" src="styled-s3-tray-v1.svg"></div></div>
